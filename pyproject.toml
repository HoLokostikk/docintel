[project]
name = "docintel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HoLokostikk", email = "kostiantyn.holovskyi.shi.2025@lpnu.ua" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.142.1",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
]

[project.scripts]
docintel = "docintel:main"
docintel-parse = "docintel.ingest.cli:main"
docintel-golden = "docintel.ingest.golden:main"
docintel-eval = "docintel.eval.report:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]


[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=docintel --cov-report=term-missing"

[[tool.mypy.overrides]]
module = ["fitz.*", "docling.*", "docling_core.*"]
ignore_missing_imports = true
